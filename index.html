<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전자 서명 패드 (투명 PNG 생성기)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
        </svg>
        <h1>전자 서명</h1>
      </div>
      <div class="size-pill" id="sizePill">
        <span class="status-dot" id="statusDot"></span>
        <span id="detectedSizeText">서명 대기 중</span>
      </div>
    </header>

    <main class="card-section">
      <!-- 컴팩트 상단 툴바: 펜 색상, 굵기, 가이드라인 토글 -->
      <div class="compact-toolbar">
        <!-- 펜 색상 칩 -->
        <div class="color-options" id="colorOptions">
          <button type="button" class="color-btn active" data-color="#111827" style="--btn-color: #111827;" title="검정색"></button>
          <button type="button" class="color-btn" data-color="#1e3a8a" style="--btn-color: #1e3a8a;" title="남색 (결재용)"></button>
          <button type="button" class="color-btn" data-color="#0284c7" style="--btn-color: #0284c7;" title="파랑"></button>
          <button type="button" class="color-btn" data-color="#dc2626" style="--btn-color: #dc2626;" title="붉은색 (도장)"></button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 펜 굵기 도트 아이콘 -->
        <div class="stroke-options" id="strokeOptions">
          <button type="button" class="tool-btn stroke-dot-btn" data-size="2" title="얇은 선 (2px)">
            <span class="dot dot-sm"></span>
          </button>
          <button type="button" class="tool-btn stroke-dot-btn active" data-size="3.5" title="보통 선 (3.5px)">
            <span class="dot dot-md"></span>
          </button>
          <button type="button" class="tool-btn stroke-dot-btn" data-size="5.5" title="굵은 선 (5.5px)">
            <span class="dot dot-lg"></span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 가이드 토글 아이콘 -->
        <div class="toggle-group">
          <button type="button" id="toggleGridBtn" class="tool-btn" title="투명 격자 배경 보기">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          </button>
          <button type="button" id="toggleGuidelineBtn" class="tool-btn active" title="기준선 표시">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="3 3"/></svg>
          </button>
        </div>
      </div>

      <!-- 서명 캔버스 (500 x 200 px) -->
      <div class="canvas-stage">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="signatureCanvas" width="500" height="200" aria-label="서명 입력 영역"></canvas>
          <div class="guideline" id="guideline"></div>
          <div class="placeholder-tip" id="placeholderTip">
            <span>여기에 서명해 주세요</span>
          </div>
        </div>
      </div>

      <!-- 하단 아이콘 액션 바 -->
      <div class="action-bar">
        <!-- 좌측: 되돌리기 & 지우기 아이콘 -->
        <div class="action-side">
          <button type="button" id="undoBtn" class="icon-action-btn" title="마지막 획 실행 취소 (Ctrl+Z)" disabled>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"/>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
          </button>
          <button type="button" id="clearBtn" class="icon-action-btn" title="서명 전체 지우기">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>

        <!-- 우측: 저장 아이콘 & 카카오톡 아이콘 -->
        <div class="action-side">
          <!-- 저장 아이콘 버튼 (PNG 파일 저장) -->
          <button type="button" id="saveBtn" class="icon-action-btn btn-save" title="투명 서명 PNG 파일 저장">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
          </button>

          <!-- 카카오톡 아이콘 버튼 (카카오톡 등 앱으로 바로 보내기) -->
          <button type="button" id="kakaoBtn" class="icon-action-btn btn-kakao" title="카카오톡 등 앱으로 서명 보내기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3C6.48 3 2 6.48 2 10.77c0 2.8 1.88 5.25 4.69 6.61-.17.6-.63 2.18-.72 2.52-.11.42.15.42.32.3.13-.09 2.14-1.46 3.01-2.05.54.08 1.1.12 1.7.12 5.52 0 10-3.48 10-7.77C22 6.48 17.52 3 12 3z"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <!-- 미리보기 팝업 (미니멀) -->
    <div class="preview-card" id="previewCard" style="display: none;">
      <div class="preview-header">
        <span class="preview-title">크롭 완료</span>
        <span class="preview-badge" id="previewBadge">0 &times; 0 px</span>
        <button type="button" id="closePreviewBtn" class="close-btn" title="닫기">&times;</button>
      </div>
      <div class="preview-body">
        <div class="checkerboard-view">
          <img id="previewImage" alt="서명 미리보기" />
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <footer class="app-footer">
      <span>서명 크기에 딱 맞춰 여백 없이 자동 크롭됩니다 &bull; 배경 투명 PNG</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
