<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전자 서명 패드 (투명 PNG 생성기)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="badge">Tablet & Touch Ready</div>
      <h1>전자 서명 패드</h1>
      <p class="subtitle">서명 영역을 자동 감지하여 투명 PNG로 카카오톡 공유 및 다운로드합니다.</p>
    </header>

    <main class="card-section">
      <!-- 툴바: 펜 색상, 굵기, 배경 가이드 -->
      <div class="toolbar">
        <div class="tool-group">
          <label class="group-label">펜 색상</label>
          <div class="color-options" id="colorOptions">
            <button type="button" class="color-btn active" data-color="#111827" style="--btn-color: #111827;" title="검정색"></button>
            <button type="button" class="color-btn" data-color="#1e3a8a" style="--btn-color: #1e3a8a;" title="남색 (인주/결재용)"></button>
            <button type="button" class="color-btn" data-color="#0284c7" style="--btn-color: #0284c7;" title="파랑"></button>
            <button type="button" class="color-btn" data-color="#dc2626" style="--btn-color: #dc2626;" title="붉은색 (도장/강조)"></button>
          </div>
        </div>

        <div class="tool-group">
          <label class="group-label">펜 굵기</label>
          <div class="stroke-options" id="strokeOptions">
            <button type="button" class="stroke-btn" data-size="2">얇게 (2px)</button>
            <button type="button" class="stroke-btn active" data-size="3.5">보통 (3.5px)</button>
            <button type="button" class="stroke-btn" data-size="5">두껍게 (5px)</button>
          </div>
        </div>

        <div class="tool-group">
          <label class="group-label">서명판 가이드</label>
          <div class="toggle-options">
            <button type="button" id="toggleGridBtn" class="toggle-btn" title="투명 격자 배경 토글">
              <span class="icon">🏁</span> 격자 배경
            </button>
            <button type="button" id="toggleGuidelineBtn" class="toggle-btn active" title="기준선 토글">
              <span class="icon">📏</span> 기준선
            </button>
          </div>
        </div>
      </div>

      <!-- 서명 캔버스 영역 (500 x 200 px) -->
      <div class="signature-stage">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="signatureCanvas" width="500" height="200" aria-label="서명 입력 영역"></canvas>
          <div class="guideline" id="guideline"></div>
          <div class="placeholder-tip" id="placeholderTip">
            <span>여기에 터치펜이나 손가락으로 서명해 주세요</span>
          </div>
        </div>
        
        <!-- 실시간 서명 크기 감지 상태 표시 바 -->
        <div class="status-bar">
          <div class="dimension-info">
            <span class="status-dot" id="statusDot"></span>
            <span id="detectedSizeText">서명 대기 중 (최대 500 &times; 200 px)</span>
          </div>
        </div>
      </div>

      <!-- 저장 크기 옵션 -->
      <div class="export-options">
        <label class="group-label">저장 크기 방식</label>
        <div class="segment-control">
          <button type="button" class="segment-btn active" data-mode="auto" id="modeAutoBtn">
            <span class="segment-title">✂️ 서명 크기 자동 맞춤 (추천)</span>
            <span class="segment-desc">서명 획만 쏙 감지하여 불필요한 여백 없이 딱 맞게 전송/저장</span>
          </button>
          <button type="button" class="segment-btn" data-mode="full" id="modeFullBtn">
            <span class="segment-title">📐 서명란 전체 (500 &times; 200 px)</span>
            <span class="segment-desc">서명란 크기 그대로 고정 해상도로 전송/저장</span>
          </button>
        </div>
      </div>

      <!-- 하단 액션 버튼 -->
      <div class="actions">
        <div class="left-actions">
          <button type="button" id="undoBtn" class="btn btn-secondary" title="마지막 획 취소" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
            되돌리기
          </button>
          <button type="button" id="clearBtn" class="btn btn-secondary" title="전체 지우기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            다시 서명
          </button>
        </div>

        <div class="right-actions">
          <!-- 기기 파일 다운로드 버튼 -->
          <button type="button" id="downloadBtn" class="btn btn-secondary" title="기기에 PNG 파일 다운로드">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            다운로드
          </button>
          <!-- 메인 '공유하기' 버튼 (카카오톡, 메시지, 메일 등 앱으로 즉시 공유) -->
          <button type="button" id="shareBtn" class="btn btn-primary btn-share" title="카카오톡 등 앱으로 서명 전송">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>공유하기</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 미리보기 모달 / 알림 영역 -->
    <div class="preview-card" id="previewCard" style="display: none;">
      <div class="preview-header">
        <div>
          <h3>방금 생성된 서명 파일</h3>
          <span class="preview-badge" id="previewBadge">크기: 0 &times; 0 px</span>
        </div>
        <button type="button" id="closePreviewBtn" class="close-btn">&times;</button>
      </div>
      <div class="preview-body">
        <div class="checkerboard-view">
          <img id="previewImage" alt="서명 미리보기" />
        </div>
        <p class="preview-desc">투명 격자 패턴 위에서 서명 주변의 배경이 완벽하게 투명한지 확인하실 수 있습니다.</p>
        <div class="preview-actions">
          <button type="button" id="previewShareBtn" class="btn btn-primary btn-sm">🔗 공유하기</button>
          <button type="button" id="previewDownloadBtn" class="btn btn-secondary btn-sm">💾 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 메시지 -->
    <div id="toast" class="toast"></div>

    <footer class="app-footer">
      <p>💡 <strong>팁:</strong> [공유하기]를 누르면 카카오톡(나에게 보내기, 대화방), 메시지, 메일 등으로 바로 전송됩니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
