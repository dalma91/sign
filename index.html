<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>서명파일 제작기</title>
  <link rel="stylesheet" href="style.css?v=1.0.6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
          </svg>
        </div>
        <h1>서명파일 제작기</h1>
        <span class="version-tag">1.0</span>
      </div>
      <div class="size-pill" id="sizePill">
        <span class="status-dot" id="statusDot"></span>
        <span id="detectedSizeText">서명 대기 중</span>
      </div>
    </header>

    <!-- 메인 카드 -->
    <main class="card-section">
      <!-- 펜색상, 굵기, 가이드(격자선/점선): 무조건 가로 1줄 -->
      <div class="toolbar-row" style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; justify-content: space-between !important;">
        <!-- 1. 글자색 (펜 색상 칩) -->
        <div class="color-options" id="colorOptions" style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; flex-shrink: 0 !important; gap: 6px !important;">
          <button type="button" class="color-btn active" data-color="#111827" style="--btn-color: #111827;" title="검정색"></button>
          <button type="button" class="color-btn" data-color="#1e3a8a" style="--btn-color: #1e3a8a;" title="남색 (결재용)"></button>
          <button type="button" class="color-btn" data-color="#0284c7" style="--btn-color: #0284c7;" title="파랑"></button>
          <button type="button" class="color-btn" data-color="#dc2626" style="--btn-color: #dc2626;" title="붉은색 (도장)"></button>
        </div>

        <div class="divider" style="flex-shrink: 0 !important;"></div>

        <!-- 2. 굵기 (스트로크 바) -->
        <div class="stroke-options" id="strokeOptions" style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; flex-shrink: 0 !important; gap: 4px !important;">
          <button type="button" class="stroke-bar-btn" data-size="2" title="얇은 선 (2px)">
            <span class="stroke-line stroke-sm"></span>
          </button>
          <button type="button" class="stroke-bar-btn active" data-size="3.5" title="보통 선 (3.5px)">
            <span class="stroke-line stroke-md"></span>
          </button>
          <button type="button" class="stroke-bar-btn" data-size="6" title="굵은 선 (6px)">
            <span class="stroke-line stroke-lg"></span>
          </button>
        </div>

        <div class="divider" style="flex-shrink: 0 !important;"></div>

        <!-- 3. 가이드 토글 (격자 선 & 점선) -->
        <div class="toggle-group" style="display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center !important; flex-shrink: 0 !important; gap: 4px !important;">
          <!-- 격자 선 토글 버튼 -->
          <button type="button" id="toggleGridBtn" class="tool-btn" title="격자 선 토글 (모눈눈금)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="3" y1="15" x2="21" y2="15"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
            </svg>
          </button>
          <!-- 점선 토글 버튼 -->
          <button type="button" id="toggleGuidelineBtn" class="tool-btn active" title="점선 토글 (기준선)">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="2" y1="12" x2="22" y2="12" stroke-dasharray="3 3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 서명 캔버스 (500 x 200 px) -->
      <div class="canvas-stage">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="signatureCanvas" width="500" height="200" aria-label="서명 입력 영역"></canvas>
          <div class="guideline" id="guideline"></div>
          <div class="placeholder-tip" id="placeholderTip">
            <span>여기에 터치펜이나 손가락으로 서명해 주세요</span>
          </div>
        </div>
      </div>

      <!-- 하단 액션 바 -->
      <div class="action-bar">
        <!-- 좌측: 되돌리기 & 지우기 (글자 없음, 순수 아이콘 버튼) -->
        <div class="action-side left">
          <button type="button" id="undoBtn" class="square-icon-btn" title="되돌리기 (Ctrl+Z)" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"/>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
            </svg>
          </button>
          <button type="button" id="clearBtn" class="square-icon-btn" title="전체 지우기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>

        <!-- 우측: 저장 & 카톡공유 (아이콘 아래 중앙정렬 텍스트) -->
        <div class="action-side right">
          <!-- 저장 버튼 -->
          <button type="button" id="saveBtn" class="action-card-btn btn-save" title="투명 서명 PNG 파일 저장">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            <span class="btn-caption">저장</span>
          </button>

          <!-- 카톡공유 버튼 -->
          <button type="button" id="kakaoBtn" class="action-card-btn btn-kakao" title="카카오톡 등 앱으로 서명 보내기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3C6.48 3 2 6.48 2 10.77c0 2.8 1.88 5.25 4.69 6.61-.17.6-.63 2.18-.72 2.52-.11.42.15.42.32.3.13-.09 2.14-1.46 3.01-2.05.54.08 1.1.12 1.7.12 5.52 0 10-3.48 10-7.77C22 6.48 17.52 3 12 3z"/>
            </svg>
            <span class="btn-caption">카톡공유</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 미리보기 팝업 (미니멀 카드) -->
    <div class="preview-card" id="previewCard" style="display: none;">
      <div class="preview-header">
        <span class="preview-title">크롭 생성 완료</span>
        <span class="preview-badge" id="previewBadge">0 &times; 0 px</span>
        <button type="button" id="closePreviewBtn" class="close-btn" title="닫기">&times;</button>
      </div>
      <div class="preview-body">
        <div class="checkerboard-view">
          <img id="previewImage" alt="서명 미리보기" />
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <footer class="app-footer">
      <span>서명 크기에 딱 맞춰 여백 없이 자동 크롭 &bull; 배경 투명 PNG</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
