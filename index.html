<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>전자 서명 패드 (투명 PNG 생성기)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="badge">Tablet & Touch Ready</div>
      <h1>전자 서명 패드</h1>
      <p class="subtitle">서명 영역을 자동 감지하여 투명 PNG로 카카오톡 전송 및 다운로드합니다.</p>
    </header>

    <main class="card-section">
      <!-- 툴바: 펜 색상, 굵기, 배경 가이드 -->
      <div class="toolbar">
        <div class="tool-group">
          <label class="group-label">펜 색상</label>
          <div class="color-options" id="colorOptions">
            <button type="button" class="color-btn active" data-color="#111827" style="--btn-color: #111827;" title="검정색"></button>
            <button type="button" class="color-btn" data-color="#1e3a8a" style="--btn-color: #1e3a8a;" title="남색 (인주/결재용)"></button>
            <button type="button" class="color-btn" data-color="#0284c7" style="--btn-color: #0284c7;" title="파랑"></button>
            <button type="button" class="color-btn" data-color="#dc2626" style="--btn-color: #dc2626;" title="붉은색 (도장/강조)"></button>
          </div>
        </div>

        <div class="tool-group">
          <label class="group-label">펜 굵기</label>
          <div class="stroke-options" id="strokeOptions">
            <button type="button" class="stroke-btn" data-size="2">얇게 (2px)</button>
            <button type="button" class="stroke-btn active" data-size="3.5">보통 (3.5px)</button>
            <button type="button" class="stroke-btn" data-size="5">두껍게 (5px)</button>
          </div>
        </div>

        <div class="tool-group">
          <label class="group-label">서명판 가이드</label>
          <div class="toggle-options">
            <button type="button" id="toggleGridBtn" class="toggle-btn" title="투명 격자 배경 토글">
              <span class="icon">🏁</span> 격자 배경
            </button>
            <button type="button" id="toggleGuidelineBtn" class="toggle-btn active" title="기준선 토글">
              <span class="icon">📏</span> 기준선
            </button>
          </div>
        </div>
      </div>

      <!-- 서명 캔버스 영역 (500 x 200 px) -->
      <div class="signature-stage">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="signatureCanvas" width="500" height="200" aria-label="서명 입력 영역"></canvas>
          <div class="guideline" id="guideline"></div>
          <div class="placeholder-tip" id="placeholderTip">
            <span>여기에 터치펜이나 손가락으로 서명해 주세요</span>
          </div>
        </div>
        
        <!-- 실시간 서명 크기 감지 상태 표시 바 -->
        <div class="status-bar">
          <div class="dimension-info">
            <span class="status-dot" id="statusDot"></span>
            <span id="detectedSizeText">서명 대기 중 (최대 500 &times; 200 px)</span>
          </div>
        </div>
      </div>

      <!-- 옵션 설정 영역 (저장 크기 + 파일만들기 동작 설정) -->
      <div class="settings-grid">
        <!-- 설정 1: 파일만들기 버튼 클릭 시 동작 -->
        <div class="setting-card">
          <label class="group-label">파일만들기 시 동작 설정</label>
          <div class="segment-control-compact">
            <button type="button" class="action-mode-btn active" data-action="share" id="actionShareBtn">
              <span class="mode-icon">💬</span>
              <span class="mode-text"><strong>카톡 등 앱으로 보내기</strong><br><small>카카오톡, 메시지, 메일 즉시 공유</small></span>
            </button>
            <button type="button" class="action-mode-btn" data-action="download" id="actionDownloadBtn">
              <span class="mode-icon">💾</span>
              <span class="mode-text"><strong>기기에 파일 다운로드</strong><br><small>다운로드 폴더에 PNG 저장</small></span>
            </button>
          </div>
        </div>

        <!-- 설정 2: 저장 크기 방식 -->
        <div class="setting-card">
          <label class="group-label">저장 크기 방식</label>
          <div class="segment-control-compact">
            <button type="button" class="size-mode-btn active" data-mode="auto" id="modeAutoBtn">
              <span class="mode-icon">✂️</span>
              <span class="mode-text"><strong>서명 크기 자동 맞춤</strong><br><small>여백 없이 획만 꼭 맞게 저장</small></span>
            </button>
            <button type="button" class="size-mode-btn" data-mode="full" id="modeFullBtn">
              <span class="mode-icon">📐</span>
              <span class="mode-text"><strong>서명란 전체 규격</strong><br><small>500 &times; 200 px 고정</small></span>
            </button>
          </div>
        </div>
      </div>

      <!-- 하단 액션 버튼 -->
      <div class="actions">
        <div class="left-actions">
          <button type="button" id="undoBtn" class="btn btn-secondary" title="마지막 획 취소" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
            되돌리기
          </button>
          <button type="button" id="clearBtn" class="btn btn-secondary" title="전체 지우기">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
            다시 서명
          </button>
        </div>

        <div class="right-actions">
          <!-- 카카오톡/앱 바로 공유 전용 서브 버튼 -->
          <button type="button" id="directShareBtn" class="btn btn-kakao" title="카카오톡 등 앱으로 바로 공유">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.708 4.8 4.27 6.054-.188.702-.68 2.541-.778 2.932-.123.493.18.486.379.354.157-.104 2.497-1.7 3.51-2.387.525.074 1.065.114 1.619.114 4.97 0 9-3.186 9-7.115C21 6.185 16.97 3 12 3z"/></svg>
            카톡 공유
          </button>
          <!-- 메인 파일만들기 버튼 (설정된 모드에 따라 전송 또는 다운로드 실행) -->
          <button type="button" id="createFileBtn" class="btn btn-primary" title="투명 배경 PNG 파일 생성">
            <span id="createFileBtnIcon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </span>
            <span id="createFileBtnText">파일만들기</span>
          </button>
        </div>
      </div>
    </main>

    <!-- 미리보기 모달 / 알림 영역 -->
    <div class="preview-card" id="previewCard" style="display: none;">
      <div class="preview-header">
        <div>
          <h3>방금 생성된 서명 파일</h3>
          <span class="preview-badge" id="previewBadge">크기: 0 &times; 0 px</span>
        </div>
        <button type="button" id="closePreviewBtn" class="close-btn">&times;</button>
      </div>
      <div class="preview-body">
        <div class="checkerboard-view">
          <img id="previewImage" alt="서명 미리보기" />
        </div>
        <p class="preview-desc">투명 격자 패턴 위에서 서명 주변의 배경이 완벽하게 투명한지 확인하실 수 있습니다.</p>
        <div class="preview-actions">
          <button type="button" id="previewShareBtn" class="btn btn-kakao btn-sm">💬 카카오톡으로 공유</button>
          <button type="button" id="previewDownloadBtn" class="btn btn-secondary btn-sm">💾 파일로 다운로드</button>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 메시지 -->
    <div id="toast" class="toast"></div>

    <footer class="app-footer">
      <p>💡 <strong>팁:</strong> 아이패드(애플 펜슬), 갤럭시 탭(S펜)에서 서명 후 카카오톡으로 나에게 보내기나 대화방 전송이 가능합니다.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
